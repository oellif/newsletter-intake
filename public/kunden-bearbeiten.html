<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH Cockpit – Kunde bearbeiten</title>
<link rel="stylesheet" href="/mh-ci.css">
<style>
  :root { --dark:#202228; --accent:#FA8700; --bg:#F7F6F3; --border:#E5E7EB; }
  * { box-sizing: border-box; }
  body { font-family: 'Manrope', Arial, sans-serif; background: var(--bg); color: #191919; margin: 0; padding: 0 0 80px; }
  .container { max-width: 640px; margin: 0 auto; padding: 36px 28px; }
  .page-header { margin-bottom: 28px; }
  .page-header h1 { font-family: 'Varela Round','Manrope',sans-serif; font-size: 28px; font-weight: 400; letter-spacing: -0.5px; margin: 0 0 6px; }
  .page-header p { font-size: 14px; color: #6B7280; margin: 0; line-height: 1.55; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6B7280; text-decoration: none; margin-bottom: 22px; }
  .back-link:hover { color: var(--accent); }

  .form-card { background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 1px 4px rgba(25,25,25,0.06), 0 4px 16px rgba(25,25,25,0.04); }

  .form-section { margin-bottom: 24px; }
  .form-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #9CA3AF; margin: 0 0 14px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row.single { grid-template-columns: 1fr; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 700; color: #374151; }
  .field input, .field textarea {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; outline: none;
    transition: border 0.15s, box-shadow 0.15s; color: #191919;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(250,135,0,0.18);
  }
  .field input[readonly] { background: #F9FAFB; color: #6B7280; cursor: default; }
  .field textarea { resize: vertical; min-height: 80px; }

  .form-actions { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
  .btn-save { padding: 11px 28px; background: var(--accent); color: #fff; border: none; border-radius: 40px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(250,135,0,0.28); font-family: inherit; transition: box-shadow 0.15s; }
  .btn-save:hover { box-shadow: 0 6px 20px rgba(250,135,0,0.36); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn-cancel { padding: 11px 20px; background: #F3F4F6; color: #374151; border: none; border-radius: 40px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; display: inline-block; }
  .btn-cancel:hover { background: #E5E7EB; }

  .status-msg { font-size: 13px; margin-left: 4px; }
  .status-msg.ok { color: #059669; }
  .status-msg.err { color: #DC2626; }

  .state-box { text-align: center; padding: 64px 20px; color: #9CA3AF; }
  .state-box .ico { font-size: 40px; margin-bottom: 12px; }
  .state-box p { margin: 0; font-size: 14px; }
</style>
</head>
<body>
<div class="container">

  <a class="back-link" href="/kunden-datenbank.html">← Zurück zur Kundendatenbank</a>

  <div class="page-header">
    <h1 id="page-title">Kundendaten bearbeiten</h1>
    <p>Kontaktdaten und weitere Informationen zum Kunden pflegen.</p>
  </div>

  <div id="form-area">
    <div class="state-box"><div class="ico">⏳</div><p>Lade Kundendaten …</p></div>
  </div>

</div>
<script src="nav.js"></script>
<script>
(function () {
  var params  = new URLSearchParams(window.location.search);
  var kundenname = params.get('kundenname') || localStorage.getItem('kios_kundenname') || '';

  if (!kundenname) {
    document.getElementById('form-area').innerHTML =
      '<div class="state-box"><div class="ico">⚠️</div><p>Kein Kunde übergeben.</p></div>';
    return;
  }

  document.getElementById('page-title').textContent = kundenname + ' bearbeiten';
  document.title = 'MH Cockpit – ' + kundenname + ' bearbeiten';

  function buildForm(d) {
    document.getElementById('form-area').innerHTML =
      '<div class="form-card">'
      + '<div class="form-section">'
      + '  <div class="form-section-title">Allgemein</div>'
      + '  <div class="form-row single"><div class="field"><label>Kundenname</label>'
      + '    <input type="text" id="f-name" value="' + esc(d.name || kundenname) + '" readonly></div></div>'
      + '  <div class="form-row">'
      + '    <div class="field"><label>E-Mail</label><input type="email" id="f-email" value="' + esc(d.email) + '" placeholder="kunde@beispiel.de"></div>'
      + '    <div class="field"><label>Telefon</label><input type="tel" id="f-telefon" value="' + esc(d.telefon) + '" placeholder="+49 89 …"></div>'
      + '  </div>'
      + '  <div class="form-row single"><div class="field"><label>Website</label>'
      + '    <input type="url" id="f-website" value="' + esc(d.website) + '" placeholder="https://beispiel.de"></div></div>'
      + '</div>'
      + '<div class="form-section">'
      + '  <div class="form-section-title">Adresse</div>'
      + '  <div class="form-row single"><div class="field"><label>Straße + Hausnummer</label>'
      + '    <input type="text" id="f-adresse" value="' + esc(d.adresse) + '" placeholder="Musterstraße 1"></div></div>'
      + '  <div class="form-row">'
      + '    <div class="field"><label>PLZ</label><input type="text" id="f-plz" value="' + esc(d.plz) + '" placeholder="80331" style="max-width:140px"></div>'
      + '    <div class="field"><label>Stadt</label><input type="text" id="f-stadt" value="' + esc(d.stadt) + '" placeholder="München"></div>'
      + '  </div>'
      + '</div>'
      + '<div class="form-section">'
      + '  <div class="form-section-title">Kontakt & Notizen</div>'
      + '  <div class="form-row single"><div class="field"><label>Ansprechpartner</label>'
      + '    <input type="text" id="f-ansprechpartner" value="' + esc(d.ansprechpartner) + '" placeholder="Max Mustermann"></div></div>'
      + '  <div class="form-row single"><div class="field"><label>Notizen</label>'
      + '    <textarea id="f-notizen" placeholder="Interne Notizen …">' + esc(d.notizen) + '</textarea></div></div>'
      + '</div>'
      + '<div class="form-actions">'
      + '  <button class="btn-save" id="btn-save" onclick="saveForm()">Speichern</button>'
      + '  <a class="btn-cancel" href="/kunden-datenbank.html">Abbrechen</a>'
      + '  <span class="status-msg" id="status-msg"></span>'
      + '</div>'
      + '</div>';
  }

  function esc(v) { return String(v || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

  window.saveForm = function () {
    var btn = document.getElementById('btn-save');
    var msg = document.getElementById('status-msg');
    btn.disabled = true;
    msg.className = 'status-msg';
    msg.textContent = 'Speichert …';

    fetch('/.netlify/functions/kunden-master-schreiben', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name:            val('f-name') || kundenname,
        email:           val('f-email'),
        telefon:         val('f-telefon'),
        adresse:         val('f-adresse'),
        plz:             val('f-plz'),
        stadt:           val('f-stadt'),
        website:         val('f-website'),
        ansprechpartner: val('f-ansprechpartner'),
        notizen:         val('f-notizen'),
      }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false;
        if (d.success) {
          msg.className = 'status-msg ok';
          msg.textContent = '✓ Gespeichert';
        } else {
          msg.className = 'status-msg err';
          msg.textContent = '✗ ' + (d.error || 'Fehler');
        }
      })
      .catch(function () {
        btn.disabled = false;
        msg.className = 'status-msg err';
        msg.textContent = '✗ Netzwerkfehler';
      });
  };

  // Vorhandene Daten laden
  fetch('/.netlify/functions/kunden-master-lesen')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var found = (data.kunden || []).find(function (k) {
        return k.name.toLowerCase() === kundenname.toLowerCase();
      });
      buildForm(found || { name: kundenname });
    })
    .catch(function () {
      buildForm({ name: kundenname });
    });
})();
</script>
</body>
</html>
