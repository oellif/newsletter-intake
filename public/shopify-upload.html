<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopify-Tool – Produkt hochladen</title>
<link rel="stylesheet" href="/mh-ci.css">
<style>
  :root { --dark:#202228; --accent:#96BF48; --bg:#F7F6F3; --border:#E5E7EB; }
  * { box-sizing: border-box; }
  body { font-family: 'Manrope', Arial, sans-serif; background: var(--bg); color: #191919; margin: 0; padding: 0 0 80px; }
  .container { max-width: 720px; margin: 0 auto; padding: 36px 28px; }
  .page-header h1 { font-family: 'Varela Round','Manrope',sans-serif; font-size: 28px; font-weight: 400; letter-spacing: -0.5px; margin: 0 0 6px; }
  .page-header p { font-size: 14px; color: #6B7280; margin: 0 0 28px; line-height: 1.55; }
  .coming-card { background: #fff; border-radius: 14px; padding: 40px 32px; text-align: center; box-shadow: 0 1px 4px rgba(25,25,25,0.06), 0 4px 16px rgba(25,25,25,0.04); }
  .coming-icon { font-size: 48px; margin-bottom: 16px; }
  .coming-title { font-size: 20px; font-weight: 700; color: #191919; margin-bottom: 8px; }
  .coming-text { font-size: 14px; color: #6B7280; line-height: 1.6; max-width: 400px; margin: 0 auto; }
  .coming-badge { display: inline-block; margin-top: 20px; background: rgba(150,191,72,0.12); color: #5a9020; font-size: 12px; font-weight: 700; padding: 4px 14px; border-radius: 20px; }
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>Produkt hochladen</h1>
    <p>Produkte automatisiert in den Shopify-Shop hochladen.</p>
  </div>
  <div class="coming-card">
    <div class="coming-icon">📦</div>
    <div class="coming-title">In Entwicklung</div>
    <p class="coming-text">Das Frontend für den Produkt-Upload wird gerade gebaut.</p>
    <span class="coming-badge">Coming soon</span>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
