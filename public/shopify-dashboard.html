<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopify-Tool</title>
<link rel="stylesheet" href="/mh-ci.css">
<style>
  :root { --dark:#202228; --green:#96BF48; --orange:#FA8700; --bg:#F7F6F3; --border:#E5E7EB; }
  *{box-sizing:border-box;}
  body{font-family:'Manrope',Arial,sans-serif;background:var(--bg);color:#191919;margin:0;padding:0 0 80px;}
  .container{max-width:560px;margin:0 auto;padding:36px 28px;}
  h1{font-family:'Varela Round','Manrope',sans-serif;font-size:26px;font-weight:400;letter-spacing:-0.4px;margin:0 0 4px;}
  .sub{font-size:14px;color:#6B7280;margin:0 0 28px;}
  .card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 1px 4px rgba(25,25,25,0.06),0 4px 16px rgba(25,25,25,0.04);margin-bottom:16px;}
  .step-title{font-size:16px;font-weight:700;margin:0 0 14px;}
  select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'Manrope',sans-serif;font-size:14px;background:#fff;color:#191919;outline:none;transition:border-color .15s;}
  select:focus{border-color:var(--green);}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:9px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;text-decoration:none;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:none;border:1.5px solid var(--border);color:#374151;}
  .btn-ghost:hover{background:#f3f4f6;}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}
  .divider{border:none;border-top:1px solid var(--border);margin:4px 0 16px;}
  .hidden{display:none !important;}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal h2{font-size:20px;font-weight:700;margin:0 0 20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#6B7280;margin-bottom:6px;}
  .field input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'Manrope',sans-serif;font-size:14px;outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--green);}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
  .err-msg{color:#B91C1C;font-size:13px;margin-top:12px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <h1>Shopify Tool</h1>
  <p class="sub">Shop auswählen und loslegen.</p>

  <div class="card">
    <div class="step-title">Shop auswählen</div>
    <select id="shopSelect" onchange="onShopSelect()">
      <option value="">– Shop wird geladen …</option>
    </select>
    <div class="actions" id="actionRow">
      <a id="uploadLink" class="btn btn-primary hidden" href="#">Produkt hochladen</a>
    </div>
  </div>

  <hr class="divider">
  <button class="btn btn-primary" onclick="openModal()">+ Shop anlegen</button>
</div>

<!-- Modal: Neuen Shop anlegen -->
<div class="modal-bg hidden" id="modal">
  <div class="modal">
    <h2>Neuen Shop anlegen</h2>
    <div class="field"><label>Shop-Name</label><input type="text" id="mName" placeholder="z.B. Marktplatz Helden"></div>
    <div class="field"><label>Shopify-Domain</label><input type="text" id="mDomain" placeholder="mein-shop.myshopify.com"></div>
    <div class="field"><label>Access Token</label><input type="text" id="mToken" placeholder="shpat_…"></div>
    <div class="field"><label>Masterartikel-Handles (kommagetrennt)</label><input type="text" id="mArtikel" placeholder="malachit-armband, holz-ring"></div>
    <div id="modalErr" class="err-msg hidden"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveKunde()"><span id="saveBtnText">Speichern</span></button>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
const API = '/.netlify/functions/';
let kundenData = [];

async function loadShops() {
  const sel = document.getElementById('shopSelect');
  try {
    const res = await fetch(API + 'shopify-kunden-alle');
    const data = await res.json();
    kundenData = data.kunden || [];
    sel.innerHTML = '<option value="">– Shop wählen –</option>';
    kundenData.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k.id;
      opt.textContent = k.name + ' (' + k.domain + ')';
      sel.appendChild(opt);
    });
  } catch(e) {
    sel.innerHTML = '<option value="">Fehler beim Laden</option>';
  }
}

function onShopSelect() {
  const sel = document.getElementById('shopSelect');
  const kundeId = sel.value;
  const link = document.getElementById('uploadLink');
  if (kundeId) {
    link.href = '/shopify-upload.html?kunde=' + encodeURIComponent(kundeId);
    link.classList.remove('hidden');
  } else {
    link.classList.add('hidden');
  }
}

function openModal() { document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); clearErr(); }
function clearErr() { const el = document.getElementById('modalErr'); el.classList.add('hidden'); el.textContent = ''; }

async function saveKunde() {
  const name = document.getElementById('mName').value.trim();
  const domain = document.getElementById('mDomain').value.trim();
  const token = document.getElementById('mToken').value.trim();
  const artikel = document.getElementById('mArtikel').value.trim();
  if (!name || !domain || !token) { showErr('Name, Domain und Token sind Pflichtfelder.'); return; }
  const btn = document.getElementById('saveBtn');
  const btnText = document.getElementById('saveBtnText');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';
  try {
    const res = await fetch(API + 'shopify-kunde-anlegen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, domain, access_token: token, masterartikel: artikel }),
    });
    const data = await res.json();
    if (!res.ok) { showErr(data.error || 'Unbekannter Fehler.'); return; }
    closeModal();
    ['mName','mDomain','mToken','mArtikel'].forEach(id => document.getElementById(id).value = '');
    loadShops();
  } catch(e) {
    showErr(e.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Speichern';
  }
}

function showErr(msg) {
  const el = document.getElementById('modalErr');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadShops();
</script>
</body>
</html>
