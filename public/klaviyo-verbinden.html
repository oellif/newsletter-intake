<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klaviyo verbinden</title>
<style>
  :root {
    --dark: #1F2937;
    --accent: #2563EB;
    --bg: #F9FAFB;
    --border: #D1D5DB;
    --green: #059669;
    --red: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--dark);
    margin: 0;
    padding: 0 0 80px 0;
  }
  header {
    background: var(--dark);
    color: #fff;
    padding: 24px 20px;
  }
  header h1 { margin: 0 0 6px 0; font-size: 22px; }
  header p { margin: 0; color: #D1D5DB; font-size: 14px; }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 14px 0;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--dark);
  }
  label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin: 14px 0 4px 0;
  }
  .hint {
    font-weight: normal;
    font-size: 12px;
    color: #6B7280;
    margin-top: 2px;
  }
  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
  }
  button.primary {
    margin-top: 18px;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    background: var(--accent);
    color: #fff;
  }
  button.primary:disabled { background: #93C5FD; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 12px; }
  .msg.error { color: var(--red); }
  .msg.ok { color: var(--green); font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>Klaviyo verbinden</h1>
  <p>Skill 3+: Verbindet den eigenen Klaviyo-Account eines Kunden per OAuth. Kein API-Key wird eingetragen oder gespeichert.</p>
</header>
<div class="container">
  <div class="card">
    <h2>Kunde</h2>
    <input type="hidden" id="kundenname">
    <button class="primary" id="connectBtn" onclick="connect()">Mit Klaviyo verbinden</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var pre = params.get('kundenname');
  if (pre) {
    document.getElementById('kundenname').value = pre;
    checkAlreadyConnected(pre);
  }
})();
// nav.js befuellt das Kundenname-Feld ggf. erst NACH diesem Script (z.B.
// wenn der Kunde ueber localStorage/Login statt ueber ?kundenname= in der
// URL kommt) und ruft danach window.loadThemen() auf, falls vorhanden -
// gleiche Konvention wie auf den anderen Skill-Seiten.
window.loadThemen = function () {
  var name = document.getElementById('kundenname').value.trim();
  if (name) { checkAlreadyConnected(name); }
};
function checkAlreadyConnected(name) {
  fetch('/.netlify/functions/kunde-status?kundenname=' + encodeURIComponent(name))
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.klaviyoConnected) {
        var btn = document.getElementById('connectBtn');
        var msg = document.getElementById('msg');
        btn.disabled = true;
        msg.className = 'msg ok';
        msg.textContent = '✓ Bereits verbunden mit Klaviyo-Account: ' + (data.klaviyoAccountName || '(Name unbekannt)');
      }
    })
    .catch(function () { /* Status unbekannt - Button bleibt aktiv */ });
}
function connect() {
  var msg = document.getElementById('msg');
  var name = document.getElementById('kundenname').value.trim();
  if (!name) {
    msg.className = 'msg error';
    msg.textContent = 'Bitte Kundenname eingeben.';
    return;
  }
  msg.className = 'msg';
  msg.textContent = 'Weiterleitung zu Klaviyo ...';
  window.location.href = '/.netlify/functions/klaviyo-oauth-start?kunde=' + encodeURIComponent(name);
}
</script>
<script src="nav.js"></script>
</body>
</html>
