<!DOCTYPE html>
<html lang="de">
<head>
<script src="/pw-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH Cockpit – Kundendatenbank</title>
<link rel="stylesheet" href="/mh-ci.css">
<style>
  :root { --dark:#202228; --accent:#FA8700; --bg:#F7F6F3; --border:#E5E7EB; }
  * { box-sizing: border-box; }
  body { font-family: 'Manrope', Arial, sans-serif; background: var(--bg); color: #191919; margin: 0; padding: 0 0 80px; }
  .container { max-width: 900px; margin: 0 auto; padding: 36px 28px; }
  .page-header { margin-bottom: 28px; }
  .page-header h1 { font-family: 'Varela Round','Manrope',sans-serif; font-size: 28px; font-weight: 400; letter-spacing: -0.5px; margin: 0 0 6px; }
  .page-header p { font-size: 14px; color: #6B7280; margin: 0; line-height: 1.55; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap input { width: 100%; padding: 10px 16px 10px 40px; border: 1.5px solid var(--border); border-radius: 40px; font-size: 14px; font-family: inherit; background: #fff; outline: none; transition: border 0.15s, box-shadow 0.15s; }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(250,135,0,0.18); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9CA3AF; pointer-events: none; }
  .btn-primary { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 40px; font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 14px rgba(250,135,0,0.28); font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: box-shadow 0.15s; }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(250,135,0,0.36); }

  .stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-chip { background: #fff; border-radius: 10px; padding: 10px 18px; border: 1.5px solid var(--border); min-width: 110px; }
  .stat-chip strong { display: block; font-size: 24px; font-weight: 800; color: #191919; line-height: 1.1; }
  .stat-chip span { font-size: 11px; color: #9CA3AF; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; display: block; }

  .kunden-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }

  .k-card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(25,25,25,0.06), 0 4px 16px rgba(25,25,25,0.04); transition: box-shadow 0.15s, transform 0.1s; }
  .k-card:hover { box-shadow: 0 6px 24px rgba(25,25,25,0.11); transform: translateY(-1px); }
  .k-name { font-size: 15px; font-weight: 700; color: #191919; margin: 0 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .k-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; min-height: 24px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .badge-nl-ok   { background: rgba(52,211,153,0.12); color: #059669; }
  .badge-nl-nok  { background: rgba(248,113,113,0.12); color: #DC2626; }
  .badge-nl-wait { background: rgba(156,163,175,0.13); color: #6B7280; }

  .k-contact { font-size: 12px; color: #6B7280; margin: -4px 0 10px; line-height: 1.6; }
  .k-contact a { color: #6B7280; text-decoration: none; }
  .k-contact a:hover { color: var(--accent); }

  .k-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-tool { flex: 1; padding: 7px 0; border-radius: 40px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid; background: transparent; font-family: inherit; transition: background 0.12s; text-align: center; min-width: 70px; }
  .btn-nl { color: #FA8700; border-color: rgba(250,135,0,0.35); }
  .btn-nl:hover { background: rgba(250,135,0,0.07); }
  .btn-sh { color: #4d7a00; border-color: rgba(150,191,72,0.4); }
  .btn-sh:hover { background: rgba(150,191,72,0.07); }
  .btn-edit { flex: 0 0 auto; padding: 7px 14px; border-radius: 40px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border); background: transparent; font-family: inherit; color: #6B7280; text-decoration: none; display: inline-flex; align-items: center; transition: background 0.12s, color 0.12s; }
  .btn-edit:hover { background: #F3F4F6; color: #374151; }

  .state-box { text-align: center; padding: 64px 20px; color: #9CA3AF; }
  .state-box .ico { font-size: 42px; margin-bottom: 12px; }
  .state-box p { margin: 0; font-size: 14px; line-height: 1.6; }
  .state-box a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="container">

  <div class="page-header">
    <h1>Kundendatenbank</h1>
    <p>Zentrale Übersicht aller Kunden — Newsletter-Status, Shopify-Status, direkte Tool-Navigation.</p>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="15" height="15" fill="none" viewBox="0 0 20 20">
        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M14 14l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input type="text" id="search-input" placeholder="Kunden suchen …" autocomplete="off">
    </div>
    <a class="btn-primary" href="/index.html">+ Neuer Kunde</a>
  </div>

  <div class="stats-row">
    <div class="stat-chip"><strong id="stat-gesamt">–</strong><span>Kunden gesamt</span></div>
    <div class="stat-chip"><strong id="stat-nl">–</strong><span>Klaviyo aktiv</span></div>
    <div class="stat-chip"><strong id="stat-sh">–</strong><span>Shopify aktiv</span></div>
  </div>

  <div id="kunden-list">
    <div class="state-box"><div class="ico">⏳</div><p>Kundenliste wird geladen …</p></div>
  </div>

</div>
<script src="nav.js"></script>
<script>
(function () {
  var allKunden = [];
  var klaviyoCache = {};
  var masterCache = {};   // name → { email, telefon, ... }

  function render() {
    var q = (document.getElementById('search-input').value || '').toLowerCase().trim();
    var list = q
      ? allKunden.filter(function (k) { return k.name.toLowerCase().indexOf(q) > -1; })
      : allKunden;

    var el = document.getElementById('kunden-list');
    if (!list.length) {
      el.innerHTML = '<div class="state-box"><div class="ico">🔍</div><p>Keine Kunden gefunden.</p></div>';
      return;
    }

    el.innerHTML = '<div class="kunden-grid">' + list.map(function (k) {
      var safe = k.name.replace(/</g, '&lt;');
      var esc  = k.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      var st   = klaviyoCache[k.name];
      var md   = masterCache[k.name.toLowerCase()] || {};

      var nlBadge = st === 'ok'
        ? '<span class="badge badge-nl-ok">📧 Klaviyo ✓</span>'
        : st === 'nok'
          ? '<span class="badge badge-nl-nok">📧 Klaviyo ✗</span>'
          : '<span class="badge badge-nl-wait">📧 …</span>';

      var contactLines = [];
      if (md.email)   contactLines.push('<a href="mailto:' + md.email + '">' + md.email.replace(/</g,'&lt;') + '</a>');
      if (md.telefon) contactLines.push('<a href="tel:' + md.telefon.replace(/\s/g,'') + '">' + md.telefon.replace(/</g,'&lt;') + '</a>');
      var contactHtml = contactLines.length
        ? '<div class="k-contact">' + contactLines.join(' · ') + '</div>'
        : '';

      return '<div class="k-card">'
        + '<div class="k-name" title="' + safe + '">' + safe + '</div>'
        + contactHtml
        + '<div class="k-badges">' + nlBadge + '</div>'
        + '<div class="k-actions">'
        + '<button class="btn-tool btn-nl" onclick="goNewsletter(\'' + esc + '\')">📧 Newsletter</button>'
        + '<button class="btn-tool btn-sh" onclick="goShopify(\'' + esc + '\')">🛍 Shopify</button>'
        + '<a class="btn-edit" href="/kunden-bearbeiten.html?kundenname=' + encodeURIComponent(k.name) + '">✏️</a>'
        + '</div>'
        + '</div>';
    }).join('') + '</div>';
  }

  function refreshStats() {
    document.getElementById('stat-gesamt').textContent = allKunden.length;
    var nlOk = Object.keys(klaviyoCache).filter(function (k) { return klaviyoCache[k] === 'ok'; }).length;
    document.getElementById('stat-nl').textContent = nlOk;
    document.getElementById('stat-sh').textContent = '–';
  }

  function loadStatuses() {
    allKunden.forEach(function (k) {
      fetch('/.netlify/functions/kunde-status?kundenname=' + encodeURIComponent(k.name))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          klaviyoCache[k.name] = d.klaviyoConnected ? 'ok' : 'nok';
          refreshStats();
          render();
        })
        .catch(function () { klaviyoCache[k.name] = 'nok'; });
    });
  }

  function loadMasterData() {
    fetch('/.netlify/functions/kunden-master-lesen')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        (data.kunden || []).forEach(function (k) {
          masterCache[k.name.toLowerCase()] = k;
        });
        render();
      })
      .catch(function () { /* Master-Sheet nicht konfiguriert – kein Fehler */ });
  }

  window.goNewsletter = function (name) {
    localStorage.setItem('kios_kundenname', name);
    localStorage.setItem('kios_modus', 'newsletter');
    window.location.href = '/anleitung.html?kundenname=' + encodeURIComponent(name);
  };

  window.goShopify = function (name) {
    localStorage.setItem('kios_kundenname', name);
    localStorage.setItem('kios_modus', 'shopify');
    window.location.href = '/shopify-dashboard.html';
  };

  document.getElementById('search-input').addEventListener('input', render);

  fetch('/.netlify/functions/kunden-alle')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      allKunden = (data.kunden || []).sort(function (a, b) {
        return a.name.localeCompare(b.name, 'de');
      });
      refreshStats();
      render();
      loadStatuses();
      loadMasterData();
    })
    .catch(function () {
      document.getElementById('kunden-list').innerHTML =
        '<div class="state-box"><div class="ico">⚠️</div>'
        + '<p>Fehler beim Laden der Kundenliste.<br>'
        + '<a href="" onclick="location.reload();return false;">Seite neu laden</a></p></div>';
    });
})();
</script>
</body>
</html>
