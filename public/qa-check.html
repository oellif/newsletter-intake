<!DOCTYPE html>
<html lang="de">
<head>
<script src="/pw-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter QA-Check</title>
<style>
  :root {
    --dark: #1F2937;
    --accent: #2563EB;
    --bg: #F9FAFB;
    --border: #D1D5DB;
    --green: #059669;
    --red: #DC2626;
    --amber: #D97706;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--dark);
    margin: 0;
    padding: 0 0 80px 0;
  }
  header {
    background: var(--dark);
    color: #fff;
    padding: 24px 20px;
  }
  header h1 { margin: 0 0 6px 0; font-size: 22px; }
  header p { margin: 0; color: #D1D5DB; font-size: 14px; }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 14px 0;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--dark);
  }
  label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin: 14px 0 4px 0;
  }
  .hint {
    font-weight: normal;
    font-size: 12px;
    color: #6B7280;
    margin-top: 2px;
  }
  input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
  }
  button.primary {
    margin-top: 18px;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    background: var(--accent);
    color: #fff;
  }
  button.primary:disabled { background: #93C5FD; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 12px; white-space: pre-wrap; }
  .msg.error { color: var(--red); }
  .section {
    margin-top: 14px;
    background: #F3F4F6;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 14px;
  }
  .section h3 { margin: 0 0 8px 0; font-size: 14px; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 11px;
    color: #fff;
  }
  .tag.ok { background: var(--green); }
  .tag.warn { background: var(--amber); }
  .link-item { font-size: 12px; margin-top: 4px; word-break: break-all; }

  .thema-row { display: flex; gap: 8px; align-items: flex-start; }
  .thema-row select { flex: 1; }
  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
  }
  button.secondary {
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--dark);
    white-space: nowrap;
  }
  .theme-hint { font-size: 12px; color: #6B7280; margin-top: 4px; }
  .theme-hint.error { color: var(--red); }
</style>
<link rel="stylesheet" href="/mh-ci.css">
</head>
<body>
<header>
  <h1>Newsletter QA-Check</h1>
  <p>Skill 11: Prueft das Klaviyo-Template auf kaputte Links, Pflichtangaben und einfache Darstellungs-Checks.</p>
</header>
<div class="container">
  <div class="card">
    <h2>Kunde</h2>
    <input type="hidden" id="kundenname">
    <label>Thema
      <span class="hint">Zeigt automatisch die offenen Themen dieses Kunden aus dem Redaktionsplan. Kein erneutes Abtippen noetig.</span>
    </label>
    <select id="thema">
      <option value="">Wird geladen ...</option>
    </select>
    <div class="theme-hint" id="themaHint"></div>
    <button class="primary" id="btn" onclick="generate()">QA-Check starten</button>
    <div class="msg" id="msg"></div>
    <div id="resultBox"></div>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var pre = params.get('kundenname');
  if (pre) {
    var el = document.getElementById('kundenname');
    if (el) { el.value = pre; }
  }
})();
if (document.getElementById('kundenname').value) { loadThemen(); }
async function loadThemen() {
  var kundenname = document.getElementById('kundenname').value.trim();
  var select = document.getElementById('thema');
  var hint = document.getElementById('themaHint');
  hint.className = 'theme-hint';
  hint.textContent = '';
  if (!kundenname) {
    hint.className = 'theme-hint error';
    hint.textContent = 'Bitte zuerst Kundenname eingeben.';
    return;
  }
  select.innerHTML = '<option value="">Laedt ...</option>';
  try {
    var res = await fetch('/.netlify/functions/themen-liste?stufe=qa&kundenname=' + encodeURIComponent(kundenname));
    var data = await res.json();
    if (!res.ok) {
      select.innerHTML = '<option value="">(Fehler beim Laden)</option>';
      hint.className = 'theme-hint error';
      hint.textContent = data.error || 'Unbekannter Fehler beim Laden der Themen.';
      return;
    }
    var themen = data.themen || [];
    if (!themen.length) {
      select.innerHTML = '<option value="">(keine offenen Themen)</option>';
      hint.className = 'theme-hint error';
      hint.textContent = data.hinweis || 'Fuer diesen Kunden ist auf dieser Stufe kein offenes Thema vorhanden.';
      return;
    }
    select.innerHTML = (themen.length > 1 ? '<option value="">Automatisch: naechstes offene Thema</option>' : '') +
      themen.map(function (t) {
        return '<option value="' + t.thema.replace(/"/g, '&quot;') + '">' + t.thema + (t.datum ? ' (' + t.datum + ')' : '') + '</option>';
      }).join('');
    hint.textContent = themen.length + ' offene' + (themen.length === 1 ? 's Thema' : ' Themen') + ' gefunden.';
  } catch (err) {
    select.innerHTML = '<option value="">(Fehler beim Laden)</option>';
    hint.className = 'theme-hint error';
    hint.textContent = 'Verbindungsfehler: ' + err.message;
  }
}

function tag(ok) {
  return '<span class="tag ' + (ok ? 'ok' : 'warn') + '">' + (ok ? 'OK' : 'Warnung') + '</span>';
}
async function generate() {
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  var resultBox = document.getElementById('resultBox');
  var kundenname = document.getElementById('kundenname').value.trim();
  var thema = document.getElementById('thema').value.trim();
  resultBox.innerHTML = '';
  if (!kundenname) {
    msg.className = 'msg error';
    msg.textContent = 'Bitte Kundenname eingeben.';
    return;
  }
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = 'QA-Check laeuft (Links werden live geprueft, kann etwas dauern) ...';
  try {
    var res = await fetch('/.netlify/functions/qa-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kundenname: kundenname, thema: thema })
    });
    var data = await res.json();
    if (!res.ok) {
      msg.className = 'msg error';
      msg.textContent = data.error || 'Unbekannter Fehler.';
      return;
    }
    msg.className = 'msg';
    msg.textContent = 'Ergebnis fuer: ' + data.thema + ' — Status: ' + data.status;
    var f = data.findings;
    var html = '';
    html += '<div class="section"><h3>Links ' + tag(f.links.ok) + '</h3>' +
      f.links.checked + ' von ' + f.links.total + ' Links geprueft.' +
      (f.links.broken.length ? '<br>Kaputt: ' + f.links.broken.map(function(l){ return '<div class="link-item">' + l.url + ' — ' + l.detail + '</div>'; }).join('') : '') +
      (f.links.warnings.length ? '<br>Warnungen: ' + f.links.warnings.map(function(l){ return '<div class="link-item">' + l.url + ' — ' + l.detail + '</div>'; }).join('') : '') +
      '</div>';
    html += '<div class="section"><h3>Pflichtangaben ' + tag(f.pflichtangaben.ok) + '</h3>' +
      (f.pflichtangaben.hinweis || (f.pflichtangaben.fehlendeStichworte.length ? 'Fehlende Stichworte: ' + f.pflichtangaben.fehlendeStichworte.join(', ') : 'Alle Stichworte gefunden.')) +
      '</div>';
    html += '<div class="section"><h3>Darstellung ' + tag(f.darstellung.ok) + '</h3>' +
      'Viewport-Meta-Tag: ' + (f.darstellung.hasViewportMeta ? 'vorhanden' : 'fehlt') + '<br>' +
      'Bilder ohne Alt-Text: ' + f.darstellung.imagesWithoutAlt + ' von ' + f.darstellung.imagesTotal +
      '</div>';
    resultBox.innerHTML = html;
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = 'Netzwerkfehler: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
<script src="nav.js"></script>
</body>
</html>
